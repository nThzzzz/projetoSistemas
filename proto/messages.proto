syntax = "proto3";

package bbs;

option java_package = "br.fei.bbs.proto";
option java_outer_classname = "BbsProto";
option java_multiple_files = true;

message Header {
  string msg_id      = 1;
  string remetente   = 2;
  int64  ts_envio_ms = 3;
  uint64 lamport     = 4;
}

enum Status {
  STATUS_UNSPECIFIED = 0;
  OK                 = 1;
  NOME_INVALIDO      = 2;
  USUARIO_EM_USO     = 3;
  CANAL_JA_EXISTE    = 4;
  USUARIO_NAO_LOGADO = 5;
  ERRO_INTERNO       = 6;
  CANAL_NAO_EXISTE   = 7;
}

message LoginReq {
}

message LoginRep {
  Status status  = 1;
  string detalhe = 2;
}

message CriarCanalReq {
  string canal = 1;
}

message CriarCanalRep {
  Status status  = 1;
  string detalhe = 2;
}

message ListarCanaisReq {
}

message ListarCanaisRep {
  Status status          = 1;
  repeated string canais = 2;
}

message PublicarReq {
  string canal    = 1;
  string mensagem = 2;
}

message PublicarRep {
  Status status  = 1;
  string detalhe = 2;
}

message Publicacao {
  string canal    = 1;
  string mensagem = 2;
  string autor    = 3;
}

message RankReq {
}

message RankRep {
  int32 rank = 1;
}

message InfoServidor {
  string nome = 1;
  int32  rank = 2;
}

message ListarServidoresReq {
}

message ListarServidoresRep {
  repeated InfoServidor servidores = 1;
}

message HeartbeatReq {
}

message HeartbeatRep {
  Status status = 1;
  reserved 2;
}

message RelogioReq {
}

message RelogioRep {
  int64 hora_ms = 1;
}

message EleicaoReq {
}

message EleicaoRep {
  Status status = 1;
}

message Coordenador {
  string nome = 1;
  int32  rank = 2;
}

enum TipoRegistro {
  TIPO_REGISTRO_UNSPECIFIED = 0;
  LOGIN                     = 1;
  CANAL                     = 2;
  PUBLICACAO                = 3;
}

message Replicacao {
  TipoRegistro tipo      = 1;
  string       usuario   = 2;
  string       canal     = 3;
  string       mensagem  = 4;
  int64        timestamp = 5;
}

message HistoricoReq {
}

message HistoricoRep {
  repeated Replicacao registros = 1;
}

message Envelope {
  Header header = 1;

  oneof body {
    LoginReq            login_req             = 2;
    LoginRep            login_rep             = 3;
    CriarCanalReq       criar_canal_req       = 4;
    CriarCanalRep       criar_canal_rep       = 5;
    ListarCanaisReq     listar_canais_req     = 6;
    ListarCanaisRep     listar_canais_rep     = 7;
    PublicarReq         publicar_req          = 8;
    PublicarRep         publicar_rep          = 9;
    Publicacao          publicacao            = 10;
    RankReq             rank_req              = 11;
    RankRep             rank_rep              = 12;
    ListarServidoresReq listar_servidores_req = 13;
    ListarServidoresRep listar_servidores_rep = 14;
    HeartbeatReq        heartbeat_req         = 15;
    HeartbeatRep        heartbeat_rep         = 16;
    RelogioReq          relogio_req           = 17;
    RelogioRep          relogio_rep           = 18;
    EleicaoReq          eleicao_req           = 19;
    EleicaoRep          eleicao_rep           = 20;
    Coordenador         coordenador           = 21;
    Replicacao          replicacao            = 22;
    HistoricoReq        historico_req         = 23;
    HistoricoRep        historico_rep         = 24;
  }
}
