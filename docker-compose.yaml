x-servidor: &servidor
  build:
    context: .
    dockerfile: servidor/Dockerfile
  image: bbs-servidor
  depends_on:
    - broker
    - proxy

x-bot: &bot
  build:
    context: .
    dockerfile: bot/Dockerfile
  image: bbs-bot
  depends_on:
    - broker
    - proxy

services:
  broker:
    build: ./broker
    image: bbs-broker

  proxy:
    build: ./proxy
    image: bbs-proxy

  servidor-1:
    <<: *servidor
    environment:
      SERVER_NAME: servidor-1
      BROKER_ADDR: tcp://broker:5556
      PROXY_ADDR: tcp://proxy:5557
      DATA_DIR: /data
    volumes:
      - ./dados/servidor-1:/data

  servidor-2:
    <<: *servidor
    environment:
      SERVER_NAME: servidor-2
      BROKER_ADDR: tcp://broker:5556
      PROXY_ADDR: tcp://proxy:5557
      DATA_DIR: /data
    volumes:
      - ./dados/servidor-2:/data

  bot-1:
    <<: *bot
    environment:
      BOT_NAME: bot-1
      BROKER_ADDR: tcp://broker:5555
      PROXY_ADDR: tcp://proxy:5558

  bot-2:
    <<: *bot
    environment:
      BOT_NAME: bot-2
      BROKER_ADDR: tcp://broker:5555
      PROXY_ADDR: tcp://proxy:5558
