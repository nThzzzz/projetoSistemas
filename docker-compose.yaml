x-servidor: &servidor
  build:
    context: .
    dockerfile: servidor/Dockerfile
  image: bbs-servidor
  depends_on:
    - broker
    - proxy
    - referencia

x-bot: &bot
  build:
    context: .
    dockerfile: bot/Dockerfile
  image: bbs-bot
  depends_on:
    - broker
    - proxy

services:
  broker:
    build: ./broker
    image: bbs-broker
    environment:
      TZ: America/Sao_Paulo

  proxy:
    build: ./proxy
    image: bbs-proxy
    environment:
      TZ: America/Sao_Paulo

  referencia:
    build:
      context: .
      dockerfile: referencia/Dockerfile
    image: bbs-referencia
    environment:
      TZ: America/Sao_Paulo

  servidor-1:
    <<: *servidor
    environment:
      TZ: America/Sao_Paulo
      SERVER_NAME: servidor-1
      BROKER_ADDR: tcp://broker:5556
      PROXY_ADDR: tcp://proxy:5557
      PROXY_SUB_ADDR: tcp://proxy:5558
      REFERENCIA_ADDR: tcp://referencia:5559
      DATA_DIR: /data
      CLOCK_DRIFT_MS: -1500
    volumes:
      - ${DADOS:-./dados}/servidor-1:/data

  servidor-2:
    <<: *servidor
    environment:
      TZ: America/Sao_Paulo
      SERVER_NAME: servidor-2
      BROKER_ADDR: tcp://broker:5556
      PROXY_ADDR: tcp://proxy:5557
      PROXY_SUB_ADDR: tcp://proxy:5558
      REFERENCIA_ADDR: tcp://referencia:5559
      DATA_DIR: /data
      CLOCK_DRIFT_MS: 2500
    volumes:
      - ${DADOS:-./dados}/servidor-2:/data

  bot-1:
    <<: *bot
    environment:
      TZ: America/Sao_Paulo
      BOT_NAME: bot-1
      BROKER_ADDR: tcp://broker:5555
      PROXY_ADDR: tcp://proxy:5558

  bot-2:
    <<: *bot
    environment:
      TZ: America/Sao_Paulo
      BOT_NAME: bot-2
      BROKER_ADDR: tcp://broker:5555
      PROXY_ADDR: tcp://proxy:5558

  monitor:
    build:
      context: .
      dockerfile: monitor/Dockerfile
    image: bbs-monitor
    depends_on:
      - proxy
    environment:
      TZ: America/Sao_Paulo
      PROXY_ADDR: tcp://proxy:5558
